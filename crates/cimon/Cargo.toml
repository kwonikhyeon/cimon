[package]
name = "cimon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "cimon"
path = "src/main.rs"

[dependencies]
cimon-core.workspace = true
cimon-store.workspace = true
cimon-engine.workspace = true
cimon-mcp.workspace = true
cimon-web.workspace = true
cimon-recipe.workspace = true
cimon-recipestore.workspace = true
cimon-runner.workspace = true
cimon-ctl.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
cimon-toolchain.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows-service.workspace = true

[dev-dependencies]
cimon-workspace.workspace = true
zip.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { workspace = true, features = ["cookies"] }
tempfile.workspace = true
