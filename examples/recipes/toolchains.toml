# 형식 예시 — 실제 카탈로그는 레시피 저장소에 있다. docs/recipe-spec.md §16.
schema = 1

[kind.msvc]
tier = "base"
installer = "base"
check = { vswhere = true }
fields = ["min", "components"]
hint = "Visual Studio Build Tools 를 관리자가 설치한다"

[kind.git_bash]
tier = "base"
installer = "base"
check = { path_from = "git" }
version_any = true                                  # 버전을 고정하지 않는다 — expect 는 자리표시자 없는 고정 문자열
bin = ["bin", "usr/bin"]
probe = { run = ["bash", "--version"], expect = "GNU bash, version" }
hint = "Git for Windows 를 관리자가 설치한다"

[kind.android_sdk]
tier = "base"
installer = "base"
check = { path_from = "android_sdk", sdkmanager = true }
fields = ["platforms", "build_tools"]
exports = { ANDROID_SDK_ROOT = "{root}" }
hint = "Android SDK 를 관리자가 설치하고 라이선스에 동의한다"

[kind.rust]
tier = "managed"
installer = "rustup"
components = ["clippy", "rustfmt"]
exports = { RUSTUP_TOOLCHAIN = "{version}" }
probe = { run = ["rustc", "--version"], expect = "rustc {version}" }

[kind.jdk]
tier = "managed"
installer = "archive"
url = "https://api.adoptium.net/v3/binary/version/jdk-{version_url}/windows/x64/jdk/hotspot/normal/eclipse"
checksum = { source = "adoptium" }
home = "jdk-{version}"
bin = ["jdk-{version}/bin"]
exports = { JAVA_HOME = "{home}" }
probe = { run = ["java", "-version"], expect = "\"{version_probe}\"", version_map = { strip_after = "+" } }
